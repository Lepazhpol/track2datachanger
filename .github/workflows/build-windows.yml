name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller openpyxl

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --windowed --name Track2Checker track2datachanger.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Track2Checker-exe
          path: dist/Track2Checker.exe
